name: StoneSpawn
version: '1.1.0-dev2'
main: dev.stonespawn.plugin.StoneSpawn
api-version: '26.2'
author: Stone Plugins
description: Adds a configurable server spawn point with teleport countdown, particle and sound effects, and fully translatable messages.
folia-supported: false
# Optional: used to recognize Bedrock players for the elytra glide.
softdepend: [floodgate, Geyser-Spigot]

commands:
  setspawn:
    description: Set the main spawn point, or a named extra spawn, to your current location.
    usage: /setspawn [name]

  delspawn:
    description: Delete a spawn point.
    usage: /delspawn <name>

  renamespawn:
    description: Rename a spawn point. The main spawn stays the main spawn.
    usage: /renamespawn <name> <new name>

  spawn:
    description: Teleport to a spawn point (or open the spawn selection), or teleport another player there.
    usage: /spawn [spawn] [player]

  stonespawn:
    description: Main StoneSpawn command for reloading, setting up the first-join intro and viewing help.
    usage: /stonespawn <reload|help|checkupdate|intro>
    aliases: [sp, ss]

permissions:
  stonespawn.admin:
    description: Access to all StoneSpawn admin actions (setspawn, delspawn, renamespawn, teleporting others, reload, checkupdate, intro setup, update notifications).
    default: op

  stonespawn.use:
    description: Allows teleporting yourself to a spawn point with /spawn, /spawn <name> or the spawn selection GUI.
    default: true

  stonespawn.elytra:
    description: Allows gliding (and boosting) after jumping off a spawn island, if enabled in config.yml.
    default: true

  stonespawn.bypass:
    description: Bypasses both the /spawn cooldown and the teleport delay.
    default: op
    children:
      stonespawn.bypass.cooldown: true
      stonespawn.bypass.delay: true

  stonespawn.bypass.cooldown:
    description: Allows bypassing the /spawn command cooldown.
    default: op

  stonespawn.bypass.delay:
    description: Allows bypassing the teleport delay and countdown.
    default: op
