# =====================================================================
# StoneSpawn messages (English)
#
# Supported color formats, usable at the same time in any message:
#   &-codes        e.g. &a, &b, &l
#   Hex colors     e.g. &#FF00AA
#   MiniMessage    e.g. <gradient:#ff0000:#0000ff>text</gradient>
#
# Placeholders available per message are noted in comments.
#
# Note: the teleport countdown and "arrived at spawn" message text live in
# config.yml (teleport.countdown.* / teleport.arrival.*) instead of here,
# since where/how they're displayed is also configured there.
# =====================================================================

prefix: "&l&8[&7Stone&b&lSpawn&8]&r "

general:
  no-permission: "&c✖ You don't have permission to do this."
  player-only: "&c✖ Only players can use this command."
  # {player}
  player-not-found: "&c✖ Player &f{player} &cnot found."
  reload-success: "&a✔ Configuration and messages have been reloaded."
  world-blocked: "&c✖ This feature is disabled in this world."

setspawn:
  success: "&a✔ The spawn point has been set to your current location."
  # {spawn}
  success-named: "&a✔ The spawn &b{spawn} &ahas been set to your current location."
  # {spawn}
  invalid-name: "&c✖ &f{spawn} &cis not a valid name. Allowed are a-z, 0-9, _ and - (max. 32 characters)."

delspawn:
  # {spawn}
  success: "&a✔ The spawn &b{spawn} &ahas been deleted."
  usage: "&c✖ Usage: &f/delspawn <name>"

renamespawn:
  # {old} {new}
  success: "&a✔ The spawn &b{old} &ais now called &b{new}&a."
  # {old} {new}
  success-main: "&a✔ The main spawn &b{old} &ais now called &b{new}&a - it stays the main spawn."
  # {spawn}
  name-taken: "&c✖ A spawn called &f{spawn} &calready exists."
  usage: "&c✖ Usage: &f/renamespawn <name> <new name>"

spawn:
  no-spawn-set: "&c✖ No spawn point has been set yet."
  # {spawn}
  not-found: "&c✖ There is no spawn called &f{spawn}&c."
  # {seconds}
  cooldown: "&c⏱ Please wait &b{seconds}s &cbefore using this again."
  cancelled-move: "&c✖ Teleport cancelled because you moved."
  # {player}
  teleported-other: "&a✔ You teleported &b{player} &ato spawn."
  # {player}
  teleported-by: "&a✔ You have been teleported to spawn by &b{player}&a."

help:
  header: "<gradient:#9AA5B1:#55C6FF><bold>▬▬▬▬▬ StoneSpawn Help ▬▬▬▬▬</bold></gradient>"
  setspawn: "&b/setspawn &8» &7Set the spawn point to your current location"
  spawn: "&b/spawn [player] &8» &7Teleport to spawn, or teleport another player"
  spawn-named: "&b/spawn <spawn> &8» &7Teleport to a specific spawn"
  setspawn-named: "&b/setspawn <name> &8» &7Set an additional, named spawn"
  delspawn: "&b/delspawn <name> &8» &7Delete a spawn"
  renamespawn: "&b/renamespawn <name> <new name> &8» &7Rename a spawn"
  reload: "&b/stonespawn reload &8» &7Reload the configuration and messages"
  checkupdate: "&b/stonespawn checkupdate &8» &7Check Modrinth for a new version right now"
  intro: "&b/stonespawn intro &8» &7Set up and test the first-join intro"
  help: "&b/stonespawn help &8» &7Show this help menu"

update:
  # {version} {current} {behind}
  available: "&l&8[&7Stone&b&lSpawn&8]&r &fA new version is available: &a{version} &7(you're on &c{current}&7, &e{behind} &7behind). Check Modrinth to update."
  versions-behind: "{count} version(s)"
  versions-behind-unknown: "an unknown number of versions"
  check-triggered: "&b⟳ &7Checking Modrinth for updates now... &8watch the console for the result."

elytra:
  # Shown in the action bar when gliding starts, empty ("") = off. {key}
  boost-hint: "&e✦ &7Press &b{key} &7for a rocket boost!"
  keys:
    swap-hand: "F"
    sneak: "Shift"
    left-click: "Left click"
  # For Bedrock players, who start gliding themselves by jumping in mid-air. {key}
  bedrock-hint: "&e✦ &7Press &bjump &7to glide, &b{key} &7for a rocket boost!"
  # Used for Bedrock players when the boost is disabled.
  bedrock-glide-hint: "&e✦ &7Press &bjump &7to glide!"
  bedrock-keys:
    swap-hand: "Swap hands"
    sneak: "Sneak"
    left-click: "Attack"

intro:
  # Shown in the action bar while the intro runs, if it can be skipped.
  skip-hint: "&7Press &fShift &7to skip the intro"
  usage: "&c✖ Usage: &f/stonespawn intro <play [player]|addpoint <name>|removepoint <name>|lookat <name> [clear]|list|preview>"
  # {player}
  playing: "&a✔ Playing the intro for &b{player}&a."
  # {player}
  already-playing: "&c✖ &f{player} &cis already watching the intro."
  no-points: "&c✖ The intro has no camera points yet. Add one with &f/stonespawn intro addpoint <name>&c."
  # {point}
  point-added: "&a✔ Camera point &b{point} &aadded at your position and view."
  # {point}
  point-moved: "&a✔ Camera point &b{point} &amoved to your position and view."
  # {point}
  point-removed: "&a✔ Camera point &b{point} &aremoved."
  # {point}
  point-not-found: "&c✖ There is no camera point called &f{point}&c."
  # {point}
  invalid-name: "&c✖ &f{point} &cis not a valid name. Allowed are a-z, 0-9, _ and - (max. 32 characters)."
  list-header: "&7Intro camera points, in order:"
  # {number} {point} {world} {x} {y} {z}
  list-entry: "&8{number}. &b{point} &7- {world} {x}, {y}, {z}"
  list-empty: "&7The intro has no camera points yet."
  save-failed: "&c✖ intro.yml could not be saved - see the console for why."
  # {point} {x} {y} {z}
  lookat-set: "&a✔ Camera point &b{point} &anow keeps looking at the block at &f{x}, {y}, {z}&a."
  # {point}
  lookat-cleared: "&a✔ Camera point &b{point} &alooks in its saved direction again."
  # {range}
  lookat-no-block: "&c✖ Look at a block (up to {range} blocks away) to choose what the camera looks at."
  # {point} {world}
  lookat-other-world: "&c✖ Camera point &f{point} &cis in the world &f{world}&c - go there first."
  preview-shown: "&a✔ Showing the camera path for 60 seconds: &bblue &a= flight, &egold &a= points, &2green &a= look-at targets. Run the command again to hide it."
  preview-hidden: "&7Camera path hidden."
