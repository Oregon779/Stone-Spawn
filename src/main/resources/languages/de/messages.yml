# =====================================================================
# StoneSpawn Nachrichten (Deutsch)
#
# Unterstützte Farbformate, gleichzeitig nutzbar in jeder Nachricht:
#   &-Codes        z.B. &a, &b, &l
#   Hex-Farben     z.B. &#FF00AA
#   MiniMessage    z.B. <gradient:#ff0000:#0000ff>Text</gradient>
#
# Verfügbare Platzhalter stehen als Kommentar dabei.
#
# Hinweis: Der Text für den Teleport-Countdown und die "am Spawn
# angekommen"-Nachricht liegt in der config.yml (teleport.countdown.* /
# teleport.arrival.*), da dort auch festgelegt wird, wo sie angezeigt werden.
# =====================================================================

prefix: "&l&8[&7Stone&b&lSpawn&8]&r "

general:
  no-permission: "&c✖ Du hast keine Berechtigung dafür."
  player-only: "&c✖ Dieser Befehl kann nur von Spielern verwendet werden."
  # {player}
  player-not-found: "&c✖ Spieler &f{player} &cwurde nicht gefunden."
  reload-success: "&a✔ Konfiguration und Nachrichten wurden neu geladen."
  world-blocked: "&c✖ Diese Funktion ist in dieser Welt deaktiviert."

setspawn:
  success: "&a✔ Der Spawnpunkt wurde auf deine aktuelle Position gesetzt."

spawn:
  no-spawn-set: "&c✖ Es wurde noch kein Spawnpunkt festgelegt."
  # {seconds}
  cooldown: "&c⏱ Bitte warte noch &b{seconds}s&c, bevor du das erneut nutzen kannst."
  cancelled-move: "&c✖ Teleport abgebrochen, da du dich bewegt hast."
  # {player}
  teleported-other: "&a✔ Du hast &b{player} &azum Spawn teleportiert."
  # {player}
  teleported-by: "&a✔ Du wurdest von &b{player} &azum Spawn teleportiert."

help:
  header: "<gradient:#9AA5B1:#55C6FF><bold>▬▬▬▬▬ StoneSpawn Hilfe ▬▬▬▬▬</bold></gradient>"
  setspawn: "&b/setspawn &8» &7Setzt den Spawnpunkt auf deine aktuelle Position"
  spawn: "&b/spawn [Spieler] &8» &7Teleportiert zum Spawn oder einen anderen Spieler dorthin"
  reload: "&b/stonespawn reload &8» &7Lädt Konfiguration und Nachrichten neu"
  checkupdate: "&b/stonespawn checkupdate &8» &7Prüft sofort auf Modrinth nach einer neuen Version"
  help: "&b/stonespawn help &8» &7Zeigt dieses Hilfe-Menü an"

update:
  # {version} {current} {behind}
  available: "&l&8[&7Stone&b&lSpawn&8]&r &fEs gibt eine neue Version: &a{version} &7(du bist auf &c{current}&7, &e{behind} &7dahinter). Schau auf Modrinth für das Update vorbei."
  versions-behind: "{count} Version(en)"
  versions-behind-unknown: "einer unbekannten Anzahl an Versionen"
  check-triggered: "&b⟳ &7Prüfe Modrinth jetzt auf Updates... &8schau in die Konsole für das Ergebnis."
