# =====================================================================
#                          StoneSpawn - intro.yml
#                        A plugin by Stone Plugins
# =====================================================================
#
# A short intro for players who join the server for the very first time:
# the camera flies from point to point, every point shows its own title,
# chat lines and sound, and at the end the player is back where the intro
# started (the main spawn, if spawn.join.mode in config.yml sends new
# players there) and the book below opens.
#
# Set the camera points in-game. Stand where the camera should be and
# look where it should look, then use:
#   /stonespawn intro addpoint <name>     add a point (or move it there)
#   /stonespawn intro removepoint <name>  remove a point
#   /stonespawn intro lookat <name>       the camera keeps looking at the
#                                         block you look at ("clear" = off)
#   /stonespawn intro list                show all points in order
#   /stonespawn intro preview             show the camera path as particles
#   /stonespawn intro play [player]       watch the intro or show it
# After changing this file by hand, run /stonespawn reload.
#
# Texts support &-codes, hex colors (&#FF00AA), MiniMessage and the
# placeholder {player}.
# Bedrock players can't follow a flying camera, so they jump from point
# to point instead and see the same texts.
#
# Missing options are added automatically on plugin updates. Existing
# values you changed are never overwritten, and your points are never
# touched.
# =====================================================================

# Play the intro for players who join the server for the very first time.
enabled: false

# Players can end the intro early by pressing Shift (sneak). They are
# still brought back and get the book.
skippable: true

# Ticks to wait after joining before the intro starts, so the world has
# finished loading for the player (20 ticks = 1 second).
start-delay-ticks: 40

# How the camera travels from point to point:
#   CURVE    -> one smooth curve through all points, like a camera drone
#   STRAIGHT -> straight lines from point to point
path: CURVE

# Default timing of every point, in seconds. Each point can override both.
#   fly-seconds:  how long the camera flies from the previous point to it
#   stay-seconds: how long the camera stays there while its texts show;
#                 0 = the camera flies through without slowing down
fly-seconds: 4.0
stay-seconds: 3.0

# Subtitles appear letter by letter, with a soft typing sound.
typewriter:
  enabled: true
  ticks-per-letter: 1
  # "" = no sound.
  sound: BLOCK_NOTE_BLOCK_HAT
  sound-volume: 0.3
  sound-pitch: 1.8

# A bar at the top of the screen showing the current chapter and how much
# of the intro is left. {chapter} = "chapter" of the current point (or its
# title), {percent} = progress, {player} = the viewer.
bossbar:
  enabled: true
  text: "{chapter}"
  # PINK, BLUE, RED, GREEN, YELLOW, PURPLE or WHITE
  color: WHITE
  # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12 or NOTCHED_20
  style: PROGRESS

# Music for the whole intro, stopped when it ends. A sound name like
# MUSIC_DISC_RELIC or a resource pack sound like "myserver:intro".
# Plays in the music category, so players who turned music off don't
# hear it. "" = no music.
music:
  sound: ""
  volume: 1.0
  pitch: 1.0

# Time of day and weather the viewer sees when the intro starts (only the
# viewer, the world doesn't change). Points can change them on the way;
# the time of day then shifts smoothly during the flight.
#   time:    a number of ticks (0-24000) or sunrise, day, noon, sunset,
#            night, midnight - "" = the world's time
#   weather: clear or rain - "" = the world's weather
time: ""
weather: ""

# Console commands run when the intro ends (also when it was skipped),
# e.g. to give a starter kit. Only for the automatic first-join intro -
# never for "/stonespawn intro play" - so rewards are given only once.
# {player} = the player's name.
end-commands: []

# The camera points, in this order. "/stonespawn intro addpoint" fills in
# world, x, y, z, yaw and pitch - add the texts yourself. Every point
# can have:
#   title, subtitle             shown when the camera arrives
#   chapter                     shown in the boss bar (default: the title)
#   chat                        lines sent to the chat at that moment
#   sound                       e.g. ENTITY_PLAYER_LEVELUP
#   sound-volume, sound-pitch
#   commands                    console commands run when the camera
#                               arrives ({player} = the viewer)
#   fly-seconds, stay-seconds   see above
#   look-at                     x, y, z the camera keeps looking at while
#                               it flies to and stays at this point - set
#                               it with "/stonespawn intro lookat <name>"
#   orbit-degrees               the camera circles this far around its
#                               look-at target while it stays here, e.g.
#                               90 or 360 (negative = other direction)
#   time, weather               see above, from this point on
# Example:
#   points:
#     welcome:
#       world: world
#       x: 0.5
#       y: 90.0
#       z: 0.5
#       yaw: 0.0
#       pitch: 20.0
#       title: "&b&lWelcome, {player}!"
#       subtitle: "&7to our server"
#       chapter: "&bWelcome"
#       chat:
#         - "&7This is where every adventure starts."
#       sound: ENTITY_PLAYER_LEVELUP
#       time: sunset
#       look-at:
#         x: 10.5
#         y: 80.5
#         z: 10.5
#       orbit-degrees: 90
points: {}

# A book that opens when the intro ends. Every entry of "pages" is one
# page; inside double quotes, \n starts a new line.
book:
  enabled: true
  title: "Welcome"
  author: "The server team"
  pages:
    - "&lWelcome, {player}!\n\n&rHave fun on our server! The rules are on the next page."
    - "&lRules\n\n&r1. Be nice to each other\n2. No griefing\n3. No cheating"
